# Ilex transect project configuration
# All paths are relative to the project root (located with here::here()).
# Everything under data/ is local only and not tracked by git.

transect:
  start:
    name: "Industrial Richmond"
    lat: 37.584817
    lon: -77.472433
  end:
    name: "Pocahontas State Park"
    lat: 37.373768
    lon: -77.570813
  input_crs: 4326          # coordinates above are WGS84 lat/lon

buffer:
  half_width_km: 2         # distance on each side of the transect (total width 4 km)
  end_cap: "ROUND"         # ROUND, FLAT, or SQUARE
  quad_segs: 30            # segments per quarter circle for the round ends

crs: 2925                  # NAD83(HARN) / Virginia South (ftUS), native CRS of the 12in South tiles

tile_index:
  dir: "data/raw/tile_index"
  name_field: "Name"
  # Searched in order. North zone is included only to catch zone-boundary overlap;
  # its tiles are in EPSG:2924 and would need reprojection if any are selected.
  layers:
    - "2025_VGIN_12in_South_Tiles"
    - "2025_VGIN_12in_North_Tiles"

paths:
  tiles_dir: "data/raw/tiles"        # searched recursively for .sid files
  derived: "data/derived"            # AOI, tile lists, footprints
  geotiff: "data/geotiff"            # converted GeoTIFFs (written by convert_mrsid.py), RGB
  tiles_4band: "data/raw/tiles_tif"  # VGIN 4-band GeoTIFFs (red, green, blue, nir), same grid

# Tiles used for the mosaic (R/03_build_vrt.R) and crown extraction (R/06_holly_objects.R):
#   "4band": VGIN 4-band GeoTIFFs (RGB + NIR, uncompressed originals)
#   "rgb":   GeoTIFFs converted from the MrSID tiles (RGB only, lossy compression)
imagery_source: "4band"

windows:
  length_km: 1             # window length along the transect; windows tile it without overlap
  # Windows span the full buffer width (2 * half_width_km). The round end caps beyond the
  # transect endpoints are not included in any window.

nlcd:
  # Annual NLCD (USGS), read for the AOI through the USGS web coverage service.
  wcs_url: "https://dmsdata.cr.usgs.gov/geoserver"
  year: 2025               # matches the 2025 imagery
  crs: 5070                # NAD83 / CONUS Albers, native NLCD grid (kept, not reprojected)
  res_m: 30
  margin_m: 300            # extra margin around the AOI bounding box
  products:                # short name: WCS coverage name (workspace is "mrlc_" + coverage)
    LndCov: "Land-Cover-Native_conus_year_data"
    FctImp: "Fractional-Impervious-Surface-Native_conus_year_data"
  dir: "data/raw/nlcd"

holly:
  # Candidate holly crowns: small, isolated evergreen crowns in leaf-off (Feb-Mar) imagery.
  # Vegetation index: "auto" uses NDVI when the imagery has a nir band, otherwise GLI
  # (green leaf index, (2G - R - B) / (2G + R + B)). Thresholds are per index.
  veg_index: "auto"
  # With a nir band, "auto" uses brightness-adjusted NDVI (ndvi_adj, see R/05b_ndvi_calibration.R):
  # plain NDVI is inflated in shadow, where red falls to ~0 but NIR stays high.
  ndvi_shadow_adjust: true
  smooth_px: 3                 # mean filter (pixels) applied to the index before thresholding
  thresholds:
    gli:
      crown: 0.05              # pixel is evergreen crown (calibrated on km 17.5 and 22.5 chips)
      context: 0.02            # pixel counts as evergreen when measuring surroundings
    ndvi:                      # plain NDVI (ndvi_shadow_adjust: false); shadow-biased
      crown: 0.60              # exceeded by 2% of NLCD deciduous (41), 45% of evergreen (42) pixels
      context: 0.50            # exceeded by 10% of deciduous, 77% of evergreen pixels
    ndvi_adj:                  # deciduous-forest SDs above the leaf-off mean at the same brightness
      crown: 1.7               # exceeded by 5% of deciduous (flat across brightness), 28% of evergreen
      context: 1.0             # exceeded by 15% of deciduous, 68% of evergreen
  # Objects kept by R/06_holly_objects.R (loose, so the candidate rule can be tuned later)
  extract_diam_ft: [6, 30]     # equivalent-circle diameter range
  context_cell_px: 10          # aggregate the context mask to 10 px (10 ft) cells
  context_window: 7            # cells; 7 x 10 ft = 70 ft neighbourhood
  # Candidate rule (applied by holly_candidates() in R/functions.R)
  candidate_diam_ft: [10, 20]
  context_max: 0.25            # max evergreen fraction in the 70 ft neighbourhood (isolation)
  exclude_nlcd: [11, 21, 22, 23, 24]   # water and developed classes ("non-developed" areas only)
  workers: 6                   # tiles processed in parallel
  dir: "data/derived/holly"

focal:
  # Focal trees for field work (R/08_focal_trees.R), balanced across an urbanization index
  n_trees: 100                 # primaries
  n_bins: 10                   # equal-width bins of the urbanization index; n_trees / n_bins each
  alternates_per_bin: 10       # backups per bin, ranked, for crowns that turn out not to be holly
  min_spacing_m: 100           # minimum distance between any two listed trees (relatedness)
  buffer_m: 500                # radius of the landscape-context neighbourhood (30 m NLCD grid)
  exclude_nlcd: [11]           # water only: developed land is allowed for focal trees
  # Urbanization index = mean impervious % in the neighbourhood; heterogeneity index = PC1 of:
  heterogeneity_metrics: [shdi, shei, edge_density, imperv_sd]
  urban_transform: asinsqrt    # bins equal-width on asin(sqrt(impervious fraction)); or "none"
  seed: 2025

forest_composition:
  # Evergreen vs deciduous share of NLCD forest (41-43) from leaf-off ndvi_adj (R/09_forest_composition.R)
  points_per_window: 6000      # forest points in the most-forested 1 km window; same density elsewhere
  candidate_points: 800000     # random AOI points drawn before keeping forest ones
  components: 2                # Gaussian mixture components (deciduous, evergreen) on 3 x 3 ndvi_adj
  n_boot: 200                  # bootstrap replicates (refits the mixture each time)
  seed: 9
